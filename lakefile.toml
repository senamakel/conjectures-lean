name = "Cramer"
defaultTargets = ["Cramer"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "Erdos985"
git = "https://github.com/senamakel/erdos-985.git"
rev = "9538edb73dc72c8fdc04b4e0df076c8930ee2fba"


[[require]]
name = "Erdos233"
git = "https://github.com/senamakel/erdos-233.git"
rev = "1ff9f39b4b3d724fd8338fd01252c179eb302acf"

[[require]]
name = "Schoenfeld"
git = "https://github.com/senamakel/schoenfeld-rh.git"
rev = "b2c31374576f5f9e5be841b99b3011122b30361e"

[[lean_lib]]
name = "Cramer"

# Lean-core-only computational checks (no Mathlib), so the kernel `decide` data modules load fast.
[[lean_lib]]
name = "CramerCompute"
globs = ["CramerCompute.+"]
