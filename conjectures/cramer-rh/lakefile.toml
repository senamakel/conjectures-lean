name = "Cramer"
defaultTargets = ["Cramer"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "Erdos985"
path = "../erdos-985"

[[require]]
name = "Erdos233"
path = "../erdos-233"

[[require]]
name = "Schoenfeld"
path = "../schoenfeld-rh"

[[lean_lib]]
name = "Cramer"

# Lean-core-only computational checks (no Mathlib), so the kernel `decide` data modules load fast.
[[lean_lib]]
name = "CramerCompute"
globs = ["CramerCompute.+"]
