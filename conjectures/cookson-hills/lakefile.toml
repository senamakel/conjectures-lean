name = "CooksonHills"
defaultTargets = ["CooksonHills"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

# Vendored from github.com/openai/math (Apache-2.0); see NOTICE.
[[lean_lib]]
name = "OAI"
srcDir = "Vendor"
globs = ["OAI.NumberTheory.PiExponent.+"]

[[lean_lib]]
name = "CooksonHills"
