name = "Robin"
defaultTargets = ["Robin"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "Erdos985"
path = "../erdos-985"

[[lean_lib]]
name = "Robin"

[[lean_lib]]
name = "RobinChecks"
globs = ["RobinChecks.+"]

[[lean_lib]]
name = "RobinCompute"
globs = ["RobinCompute.*"]
precompileModules = true
